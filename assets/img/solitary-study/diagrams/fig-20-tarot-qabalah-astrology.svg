<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig20-title fig20-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig20-title">Figure 20. Tarot, Qabalah and astrology: the relationships</title><desc id="fig20-desc">Two panels. Left, the Major Arcana: 22 trumps equal 22 Hebrew letters equal 22 paths on the Tree; the letters divide into 3 mothers, attributed to the elements Air, Water and Fire; 7 doubles, attributed to the planets; 12 simples, attributed to the zodiac signs. Right, the Minor Arcana: four suits correspond to the four elements and four worlds; Aces to Tens correspond to the ten Sephiroth; the 36 small cards from Two to Ten correspond to the 36 decans of the zodiac; the 16 court cards are elemental subdivisions.</desc><defs><marker id="arr20" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 20</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">Tarot, Qabalah and astrology: the relationships</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><text x="330.0" y="130.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="14" fill="#c9a96e" text-anchor="middle" letter-spacing="0.25em">MAJOR ARCANA</text><rect x="160.0" y="160.0" width="340.0" height="62.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="330.0" y="188.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="15" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">22 trumps</text><text x="330.0" y="206.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">= 22 Hebrew letters = 22 paths</text><rect x="80.0" y="300.0" width="160.0" height="80.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="160.0" y="337.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">3 mother letters</text><text x="160.0" y="355.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">Air · Water · Fire</text><line x1="330.0" y1="222.0" x2="160.0" y2="300.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr20)"/><rect x="250.0" y="300.0" width="160.0" height="80.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="330.0" y="337.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">7 double letters</text><text x="330.0" y="355.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">the seven planets</text><line x1="330.0" y1="222.0" x2="330.0" y2="300.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr20)"/><rect x="420.0" y="300.0" width="160.0" height="80.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="500.0" y="337.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">12 simple letters</text><text x="500.0" y="355.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">the twelve signs</text><line x1="330.0" y1="222.0" x2="500.0" y2="300.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr20)"/><text x="330.0" y="430.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">Classification from the Sefer Yetzirah</text><text x="870.0" y="130.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="14" fill="#c9a96e" text-anchor="middle" letter-spacing="0.25em">MINOR ARCANA</text><rect x="700.0" y="160.0" width="340.0" height="72.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="870.0" y="193.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">4 suits</text><text x="870.0" y="211.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">4 elements · 4 worlds</text><rect x="700.0" y="260.0" width="340.0" height="72.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="870.0" y="293.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Aces to Tens</text><text x="870.0" y="311.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">the 10 Sephiroth</text><rect x="700.0" y="360.0" width="340.0" height="72.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="870.0" y="393.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">36 small cards (2–10)</text><text x="870.0" y="411.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">the 36 decans of the zodiac</text><rect x="700.0" y="460.0" width="340.0" height="72.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="870.0" y="493.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">16 court cards</text><text x="870.0" y="511.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">elemental subdivisions</text><line x1="600.0" y1="120.0" x2="600.0" y2="600.0" stroke="#8b7448" stroke-width="0.8" stroke-dasharray="3 5"/><text x="600.0" y="640.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle" font-style="italic">Every card has a place on the Tree and in the heavens: the deck as a map of the whole tradition.</text><text x="1184.0" y="708.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>