<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig6-title fig6-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig6-title">Figure 6. Procession, participation and return</title><desc id="fig6-desc">A circle with three stations. At the top, Remaining (monē): the effect pre-exists in its cause. On the right, Procession (proodos): the effect goes forth and becomes distinct. On the left, Return (epistrophē): the effect turns back toward its source. Arrows run clockwise around the circle. In the center: Participation, the effect shares in what its cause is.</desc><defs><marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 6</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">Procession, participation and return</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><circle cx="600.0" cy="440.0" r="190.0" stroke="#c9a96e" stroke-width="1.3" fill="none"/><circle cx="600.0" cy="250.0" r="44.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="600.0" y="248.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.12em">REMAINING</text><text x="600.0" y="266.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle" font-style="italic">monē</text><text x="600.0" y="130.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle"><tspan x="600.0" dy="0.0">The effect pre-exists in</tspan><tspan x="600.0" dy="16.5">its cause.</tspan></text><circle cx="764.5" cy="535.0" r="44.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="764.5" y="533.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.12em">PROCESSION</text><text x="764.5" y="551.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle" font-style="italic">proodos</text><text x="851.1" y="585.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle"><tspan x="851.1" dy="0.0">The effect goes forth</tspan><tspan x="851.1" dy="16.5">and becomes distinct.</tspan></text><circle cx="435.5" cy="535.0" r="44.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="435.5" y="533.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.12em">RETURN</text><text x="435.5" y="551.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle" font-style="italic">epistrophē</text><text x="348.9" y="585.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle"><tspan x="348.9" dy="0.0">The effect turns back</tspan><tspan x="348.9" dy="16.5">toward its source.</tspan></text><path d="M665.0,261.5 A190,190 0 0 1 787.1,473.0" stroke="#c9a96e" stroke-width="1.6" fill="none" marker-end="url(#arr6)"/><path d="M722.1,585.5 A190,190 0 0 1 477.9,585.5" stroke="#c9a96e" stroke-width="1.6" fill="none" marker-end="url(#arr6)"/><path d="M412.9,473.0 A190,190 0 0 1 535.0,261.5" stroke="#c9a96e" stroke-width="1.6" fill="none" marker-end="url(#arr6)"/><text x="600.0" y="434.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#c9a96e" text-anchor="middle" letter-spacing="0.2em">PARTICIPATION</text><text x="600.0" y="458.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle" font-style="italic">the effect shares in what its cause is</text><text x="1184.0" y="708.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>