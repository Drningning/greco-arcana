<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-labelledby="fig23-title fig23-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig23-title">Figure 23. Return to the Lost Word</title><desc id="fig23-desc">A circle of nine stations with the Lost Word at the center. I, the Gate of Light: allegory. II, the Nature of Reality: order. III, the Science of Correspondence: the microcosm. IV, the Hidden Virtues of Nature: the virtue of things. V, the Tree of Life: the divine names. VI, the Mystery of Regeneration: transformation. VII, the Sacred Art: operation. VIII, the Language of the Mysteries: the reading of images. IX, the Lost Word: integration, returning to I. Around the center: Freemasonry provides the allegory; the tradition provides the instruments; the Great Work is what the student does with them.</desc><defs><marker id="arr23" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="830" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="814" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 23</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">Return to the Lost Word</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><circle cx="600.0" cy="430.0" r="240.0" stroke="#8b7448" stroke-width="1" fill="none"/><circle cx="600.0" cy="190.0" r="32.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="600.0" y="197.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">I</text><text x="600.0" y="120.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">The Gate of Light</text><text x="600.0" y="138.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">Allegory</text><path d="M641.7,193.6 A240,240 0 0 1 720.0,222.2" stroke="#c9a96e" stroke-width="1.3" fill="none" marker-end="url(#arr23)"/><circle cx="754.3" cy="246.1" r="32.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="754.3" y="253.1" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">II</text><text x="785.1" y="205.4" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="start">The Nature of Reality</text><text x="785.1" y="223.4" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="start" font-style="italic">Order</text><path d="M783.9,275.7 A240,240 0 0 1 825.5,347.9" stroke="#c9a96e" stroke-width="1.3" fill="none" marker-end="url(#arr23)"/><circle cx="836.4" cy="388.3" r="32.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="836.4" y="395.3" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">III</text><text x="883.6" y="376.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="start">The Science of Correspondence</text><text x="883.6" y="394.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="start" font-style="italic">The microcosm</text><path d="M840.0,430.0 A240,240 0 0 1 825.5,512.1" stroke="#c9a96e" stroke-width="1.3" fill="none" marker-end="url(#arr23)"/><circle cx="807.8" cy="550.0" r="32.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="807.8" y="557.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">IV</text><text x="849.4" y="570.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="start">The Hidden Virtues of Nature</text><text x="849.4" y="588.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="start" font-style="italic">The virtue of things</text><path d="M783.9,584.3 A240,240 0 0 1 720.0,637.8" stroke="#c9a96e" stroke-width="1.3" fill="none" marker-end="url(#arr23)"/><circle cx="682.1" cy="655.5" r="32.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="682.1" y="662.5" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">V</text><text x="698.5" y="696.6" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="start">The Tree of Life</text><text x="698.5" y="714.6" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="start" font-style="italic">The divine names</text><path d="M641.7,666.4 A240,240 0 0 1 558.3,666.4" stroke="#c9a96e" stroke-width="1.3" fill="none" marker-end="url(#arr23)"/><circle cx="517.9" cy="655.5" r="32.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="517.9" y="662.5" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">VI</text><text x="501.5" y="696.6" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="end">The Mystery of Regeneration</text><text x="501.5" y="714.6" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="end" font-style="italic">Transformation</text><path d="M480.0,637.8 A240,240 0 0 1 416.1,584.3" stroke="#c9a96e" stroke-width="1.3" fill="none" marker-end="url(#arr23)"/><circle cx="392.2" cy="550.0" r="32.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="392.2" y="557.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">VII</text><text x="350.6" y="570.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="end">The Sacred Art</text><text x="350.6" y="588.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="end" font-style="italic">Operation</text><path d="M374.5,512.1 A240,240 0 0 1 360.0,430.0" stroke="#c9a96e" stroke-width="1.3" fill="none" marker-end="url(#arr23)"/><circle cx="363.6" cy="388.3" r="32.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="363.6" y="395.3" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">VIII</text><text x="316.4" y="376.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="end">The Language of the Mysteries</text><text x="316.4" y="394.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="end" font-style="italic">The reading of images</text><path d="M374.5,347.9 A240,240 0 0 1 416.1,275.7" stroke="#c9a96e" stroke-width="1.3" fill="none" marker-end="url(#arr23)"/><circle cx="445.7" cy="246.1" r="32.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="445.7" y="253.1" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">IX</text><text x="414.9" y="205.4" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="end">The Lost Word</text><text x="414.9" y="223.4" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="end" font-style="italic">Integration</text><path d="M480.0,222.2 A240,240 0 0 1 558.3,193.6" stroke="#c9a96e" stroke-width="1.3" fill="none" marker-end="url(#arr23)"/><circle cx="600.0" cy="430.0" r="90.0" stroke="#c9a96e" stroke-width="1.5" fill="#14110b"/><text x="600.0" y="424.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="15" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">THE LOST WORD</text><text x="600.0" y="448.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">sought through every stage</text><text x="600.0" y="790.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#b9ad95" text-anchor="middle" font-style="italic">Freemasonry provides the allegory · the tradition provides the instruments · the Great Work is what the student does with them</text><text x="1184.0" y="818.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>