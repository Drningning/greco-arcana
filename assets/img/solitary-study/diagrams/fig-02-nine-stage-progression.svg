<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig2-title fig2-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig2-title">Figure 2. The nine-stage educational progression</title><desc id="fig2-desc">Nine numbered circles rise from lower left to upper right: I Porta Lucis, The Gate of Light, 3 months; II Philosophia, The Nature of Reality, 6 months; III Scientia Hermetica, The Science of Correspondence, 4 months; IV Natura Arcana, The Hidden Virtues of Nature, 4 months; V Arbor Vitae, The Tree of Life, 6 months; VI Rosa Crucis, The Mystery of Regeneration, 4 months; VII Ars Magica, The Sacred Art, 8 months; VIII Lingua Mysteriorum, The Language of the Mysteries, 4 months; IX Verbum Perditum, The Lost Word, 3 months. A curved arrow returns from IX to I, labelled the return.</desc><defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 2</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">The nine-stage educational progression</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><line x1="140.0" y1="516.0" x2="200.0" y2="484.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr2)"/><line x1="260.0" y1="476.0" x2="320.0" y2="444.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr2)"/><line x1="380.0" y1="436.0" x2="440.0" y2="404.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr2)"/><line x1="500.0" y1="396.0" x2="560.0" y2="364.0" 