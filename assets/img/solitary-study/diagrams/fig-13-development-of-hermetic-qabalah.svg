<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig13-title fig13-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig13-title">Figure 13. The historical development of Hermetic Qabalah</title><desc id="fig13-desc">A timeline in three lanes. Jewish Kabbalah: Sefer Yetzirah, 3rd to 6th century; Sefer ha-Bahir, about 1180; the Zohar, late 13th century; Moses Cordovero, Pardes Rimonim, 1548; Isaac Luria, Safed, 16th century. Christian Cabala: Pico della Mirandola, 900 Theses, 1486; Johannes Reuchlin, De arte cabalistica, 1517; Agrippa, 1533; Kircher, Oedipus Aegyptiacus, 1652 to 1654; Knorr von Rosenroth, Kabbala Denudata, 1677 to 1684. Hermetic Qabalah: Lévi, Dogme et rituel, 1854 to 1856; Westcott, Sepher Yetzirah, 1887; Mathers, The Kabbalah Unveiled, 1887; the Golden Dawn, 1888; Crowley, 777, 1909; Fortune, The Mystical Qabalah, 1935. Arrows lead from the Zohar to Pico, from Kabbala Denudata to Mathers, from Agrippa and Lévi to the Golden Dawn.</desc><defs><marker id="arr13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 13</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">The historical development of Hermetic Qabalah</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><line x1="110.0" y1="170.0" x2="1160.0" y2="170.0" stroke="#8b7448" stroke-width="0.8"/><text x="110.0" y="130.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="start" letter-spacing="0.2em">JEWISH KABBALAH</text><line x1="110.0" y1="370.0" x2="1160.0" y2="370.0" stroke="#8b7448" stroke-width="0.8"/><text x="110.0" y="330.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="start" letter-spacing="0.2em">CHRISTIAN CABALA</text><line x1="110.0" y1="570.0" x2="1160.0" y2="570.0" stroke="#8b7448" stroke-width="0.8"/><text x="110.0" y="530.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="start" letter-spacing="0.2em">HERMETIC QABALAH</text><circle cx="139.4" cy="170.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="139.4" y="154.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Sefer Yetzirah</text><text x="139.4" y="138.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">3rd–6th c.</text><circle cx="240.0" cy="170.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="240.0" y="196.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Bahir</text><text x="240.0" y="212.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">c. 1180</text><circle cx="275.3" cy="170.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="275.3" y="154.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Zohar</text><text x="275.3" y="138.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">late 13th c.</text><circle cx="516.2" cy="170.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="516.2" y="196.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Cordovero</text><text x="516.2" y="212.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1548</text><circle cx="552.0" cy="170.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="552.0" y="154.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Luria</text><text x="552.0" y="138.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">16th c.</text><circle cx="398.4" cy="370.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="398.4" y="396.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Pico</text><text x="398.4" y="412.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1486</text><circle cx="457.3" cy="370.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="457.3" y="354.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Reuchlin</text><text x="457.3" y="338.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1517</text><circle cx="487.7" cy="370.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="487.7" y="396.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Agrippa</text><text x="487.7" y="412.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1533</text><circle cx="601.6" cy="370.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="601.6" y="354.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Kircher</text><text x="601.6" y="338.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1652–54</text><circle cx="624.0" cy="370.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="624.0" y="396.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Knorr</text><text x="624.0" y="412.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1677–84</text><circle cx="760.0" cy="570.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="760.0" y="554.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Lévi</text><text x="760.0" y="538.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1854–56</text><circle cx="812.0" cy="570.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="812.0" y="596.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Westcott</text><text x="812.0" y="612.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1887</text><circle cx="868.0" cy="570.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="868.0" y="554.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Mathers</text><text x="868.0" y="538.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1887</text><circle cx="924.0" cy="570.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="924.0" y="596.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Golden Dawn</text><text x="924.0" y="612.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1888</text><circle cx="988.0" cy="570.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="988.0" y="554.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Crowley, 777</text><text x="988.0" y="538.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1909</text><circle cx="1068.0" cy="570.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><text x="1068.0" y="596.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#ece3cf" text-anchor="middle">Fortune</text><text x="1068.0" y="612.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#b9ad95" text-anchor="middle" font-style="italic">1935</text><path d="M275.3,178.0 C275.3,270.0 398.4,270.0 398.4,362.0" stroke="#c9a96e" stroke-width="1.1" fill="none" stroke-dasharray="7 4" marker-end="url(#arr13)" opacity="0.85"/><path d="M275.3,178.0 C275.3,270.0 457.3,270.0 457.3,362.0" stroke="#c9a96e" stroke-width="1.1" fill="none" stroke-dasharray="7 4" marker-end="url(#arr13)" opacity="0.85"/><path d="M457.3,378.0 C457.3,370.0 487.7,370.0 487.7,362.0" stroke="#c9a96e" stroke-width="1.1" fill="none" stroke-dasharray="7 4" marker-end="url(#arr13)" opacity="0.85"/><path d="M275.3,178.0 C275.3,270.0 624.0,270.0 624.0,362.0" stroke="#c9a96e" stroke-width="1.1" fill="none" stroke-dasharray="7 4" marker-end="url(#arr13)" opacity="0.85"/><path d="M624.0,378.0 C624.0,470.0 868.0,470.0 868.0,562.0" stroke="#c9a96e" stroke-width="1.1" fill="none" stroke-dasharray="7 4" marker-end="url(#arr13)" opacity="0.85"/><path d="M487.7,378.0 C487.7,470.0 924.0,470.0 924.0,562.0" stroke="#c9a96e" stroke-width="1.1" fill="none" stroke-dasharray="7 4" marker-end="url(#arr13)" opacity="0.85"/><path d="M760.0,578.0 C760.0,570.0 924.0,570.0 924.0,562.0" stroke="#c9a96e" stroke-width="1.1" fill="none" stroke-dasharray="7 4" marker-end="url(#arr13)" opacity="0.85"/><path d="M139.4,178.0 C139.4,370.0 812.0,370.0 812.0,562.0" stroke="#c9a96e" stroke-width="1.1" fill="none" stroke-dasharray="7 4" marker-end="url(#arr13)" opacity="0.85"/><text x="600.0" y="680.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">Dashed arrows: documented transmission or translation between the traditions.</text><text x="1184.0" y="708.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>