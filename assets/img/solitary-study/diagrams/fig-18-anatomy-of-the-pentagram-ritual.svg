<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" role="img" aria-labelledby="fig18-title fig18-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig18-title">Figure 18. The philosophical anatomy of the Lesser Ritual of the Pentagram</title><desc id="fig18-desc">A large pentagram in a circle with the four quarters marked. East: the divine name YHVH, archangel Raphael, element Air. South: Adonai, Michael, Fire. West: Eheieh, Gabriel, Water. North: AGLA, Auriel, Earth. Above, the Qabalistic Cross: Ateh, thou art, at the forehead, Kether; Malkuth, the kingdom, at the feet; ve-Geburah, and the power, at the right shoulder; ve-Gedulah, and the glory, at the left shoulder; le-Olahm, Amen, forever. Side labels trace each part to its source: Qabalah and divine names, Stage V; elements, Stage IV; angelic tradition, Stage VII; geometry, Stage II; the pentagram as microcosm, Stage III; ritual as theurgy, Stage II.</desc><defs><marker id="arr18" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="810" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="794" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 18</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">The philosophical anatomy of the Lesser Ritual of the Pentagram</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><circle cx="600.0" cy="450.0" r="210.0" stroke="#8b7448" stroke-width="1" fill="none"/><polygon points="600.0,260.0 711.7,603.7 419.3,391.3 780.7,391.3 488.3,603.7" stroke="#c9a96e" stroke-width="1.6" fill="none"/><text x="600.0" y="187.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.22em">EAST</text><text x="600.0" y="209.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="18" fill="#ece3cf" text-anchor="middle">YHVH</text><text x="600.0" y="229.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">Raphael · Air</text><text x="870.0" y="437.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.22em">SOUTH</text><text x="870.0" y="459.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="18" fill="#ece3cf" text-anchor="middle">Adonai</text><text x="870.0" y="479.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">Michael · Fire</text><text x="600.0" y="687.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.22em">WEST</text><text x="600.0" y="709.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="18" fill="#ece3cf" text-anchor="middle">Eheieh</text><text x="600.0" y="729.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">Gabriel · Water</text><text x="330.0" y="437.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.22em">NORTH</text><text x="330.0" y="459.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="18" fill="#ece3cf" text-anchor="middle">AGLA</text><text x="330.0" y="479.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">Auriel · Earth</text><text x="600.0" y="112.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.2em">THE QABALISTIC CROSS</text><text x="600.0" y="134.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#b9ad95" text-anchor="middle">Ateh (forehead, Kether) · Malkuth (feet) · ve-Geburah (right shoulder) · ve-Gedulah (left shoulder) · le-Olahm, Amen</text><rect x="60.0" y="260.0" width="190.0" height="70.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="155.0" y="292.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12.5" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Qabalah and divine names</text><text x="155.0" y="310.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">Stage V</text><rect x="60.0" y="380.0" width="190.0" height="70.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="155.0" y="412.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12.5" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">The four elements</text><text x="155.0" y="430.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">Stage IV</text><rect x="60.0" y="500.0" width="190.0" height="70.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="155.0" y="532.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12.5" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Angelic tradition</text><text x="155.0" y="550.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">Stage VII</text><rect x="960.0" y="260.0" width="190.0" height="70.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="1055.0" y="292.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12.5" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Geometry of the pentagram</text><text x="1055.0" y="310.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">Stage II</text><rect x="960.0" y="380.0" width="190.0" height="70.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="1055.0" y="412.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12.5" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Pentagram as microcosm</text><text x="1055.0" y="430.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">Stage III</text><rect x="960.0" y="500.0" width="190.0" height="70.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="1055.0" y="532.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12.5" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Ritual as theurgy</text><text x="1055.0" y="550.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">Stage II</text><text x="600.0" y="770.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">Opening and closing: the Qabalistic Cross. Between them: the four pentagrams, the names and the archangels.</text><text x="1184.0" y="798.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>