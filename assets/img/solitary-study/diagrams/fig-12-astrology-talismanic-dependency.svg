<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig12-title fig12-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig12-title">Figure 12. Astrology and talismanic magic: a dependency map</title><desc id="fig12-desc">A flow chart. At the top, Cosmology: correspondence and the three worlds, Stages II and III. It feeds three boxes: Astrology, choosing the planet, election and hour, Stage IV; Natural magic, choosing the metal, stone and herb, Stage IV; Symbolism, choosing the image, character and divine name, Stages V and VII. Together with Intention and consecration, Stage VII, these converge on the talisman at the bottom.</desc><defs><marker id="arr12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 12</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">Astrology and talismanic magic: a dependency map</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><rect x="420.0" y="115.0" width="360.0" height="80.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="600.0" y="152.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="15" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Cosmology</text><text x="600.0" y="170.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">correspondence · the three worlds · Stages II–III</text><rect x="110.0" y="280.0" width="340.0" height="86.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="280.0" y="320.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="15" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Astrology</text><text x="280.0" y="338.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">planet · election · hour · Stage IV</text><line x1="600.0" y1="195.0" x2="280.0" y2="280.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr12)"/><line x1="280.0" y1="366.0" x2="600.0" y2="520.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr12)"/><rect x="430.0" y="280.0" width="340.0" height="86.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="600.0" y="320.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="15" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Natural magic</text><text x="600.0" y="338.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">metal · stone · herb · Stage IV</text><line x1="600.0" y1="195.0" x2="600.0" y2="280.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr12)"/><line x1="600.0" y1="366.0" x2="600.0" y2="520.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr12)"/><rect x="750.0" y="280.0" width="340.0" height="86.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="920.0" y="320.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="15" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Symbolism</text><text x="920.0" y="338.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">image · character · divine name · Stages V, VII</text><line x1="600.0" y1="195.0" x2="920.0" y2="280.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr12)"/><line x1="920.0" y1="366.0" x2="600.0" y2="520.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr12)"/><rect x="910.0" y="430.0" width="250.0" height="76.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="1035.0" y="465.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Intention</text><text x="1035.0" y="483.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">and consecration · Stage VII</text><line x1="910.0" y1="470.0" x2="690.0" y2="545.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr12)"/><rect x="450.0" y="520.0" width="300.0" height="90.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#15120c"/><text x="600.0" y="562.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="18" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">THE TALISMAN</text><text x="600.0" y="580.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">the meeting point</text><text x="600.0" y="670.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle" font-style="italic">No single discipline explains the operation; each contributes one decision.</text><text x="1184.0" y="708.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>