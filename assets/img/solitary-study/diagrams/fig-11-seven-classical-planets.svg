<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig11-title fig11-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig11-title">Figure 11. The seven classical planets and their traditional correspondences</title><desc id="fig11-desc">A seven-pointed star inside a circle with the planets in Chaldean order clockwise from the top: Saturn, Jupiter, Mars, Sun, Venus, Mercury, Moon. Arrows along the star lead Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn, the order of the weekdays. A table lists: Saturn, Saturday, lead, Binah; Jupiter, Thursday, tin, Chesed; Mars, Tuesday, iron, Geburah; Sun, Sunday, gold, Tiphareth; Venus, Friday, copper, Netzach; Mercury, Wednesday, quicksilver, Hod; Moon, Monday, silver, Yesod.</desc><defs><marker id="arr11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 11</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">The seven classical planets and their traditional correspondences</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><circle cx="330.0" cy="400.0" r="210.0" stroke="#8b7448" stroke-width="0.9" fill="none"/><line x1="421.1" y1="589.2" x2="165.8" y2="269.1" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr11)" opacity="0.9"/><line x1="165.8" y1="269.1" x2="534.7" y2="446.7" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr11)" opacity="0.9"/><line x1="534.7" y1="446.7" x2="125.3" y2="446.7" stroke="#c9a96e" stroke-widt