<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig8-title fig8-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig8-title">Figure 8. Macrocosm and microcosm</title><desc id="fig8-desc">Two concentric diagrams side by side joined by dashed lines. Left, the macrocosm: the divine or intellectual world at the center of honor, the celestial world of the stars and seven planets, and the elemental world of fire, air, water and earth. Right, the microcosm: mind, the spirit or soul, and the body. Dashed lines connect divine world with mind, celestial world with soul and spirit, elemental world with body.</desc><defs><marker id="arr8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 8</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">Macrocosm and microcosm</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><text x="320.0" y="130.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="14" fill="#c9a96e" text-anchor="middle" letter-spacing="0.3em">MACROCOSM</text><circle cx="320.0" cy="380.0" r="210.0" stroke="#c9a96e" stroke-width="1.3" fill="#0b0d10"/><text x="320.0" y="196.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle">Elemental world</text><circle cx="320.0" cy="380.0" r="140.0" stroke="#c9a96e" stroke-width="1.3" fill="#0f1216"/><text x="320.0" y="266.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle">Celestial world</text><circle cx="320.0" cy="380.0" r="70.0" stroke="#c9a96e" stroke-width="1.3" fill="#0b0d10"/><text x="320.0" y="386.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#ece3cf" text-anchor="middle">Divine world</text><text x="215.0" y="384.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#8b7448" text-anchor="middle">Saturn</text><text x="229.1" y="331.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#8b7448" text-anchor="middle">Jupiter</text><text x="267.5" y="293.1" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#8b7448" text-anchor="middle">Mars</text><text x="320.0" y="279.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#8b7448" text-anchor="middle">Sun</text><text x="372.5" y="293.1" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#8b7448" text-anchor="middle">Venus</text><text x="410.9" y="331.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#8b7448" text-anchor="middle">Mercury</text><text x="425.0" y="384.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11" fill="#8b7448" text-anchor="middle">Moon</text><text x="478.6" y="458.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11.5" fill="#8b7448" text-anchor="middle">Fire</text><text x="385.6" y="546.3" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11.5" fill="#8b7448" text-anchor="middle">Air</text><text x="257.3" y="547.4" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11.5" fill="#8b7448" text-anchor="middle">Water</text><text x="162.7" y="460.7" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="11.5" fill="#8b7448" text-anchor="middle">Earth</text><text x="880.0" y="130.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="14" fill="#c9a96e" text-anchor="middle" letter-spacing="0.3em">MICROCOSM</text><circle cx="880.0" cy="380.0" r="210.0" stroke="#c9a96e" stroke-width="1.3" fill="#0b0d10"/><text x="880.0" y="196.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle">Body</text><circle cx="880.0" cy="380.0" r="140.0" stroke="#c9a96e" stroke-width="1.3" fill="#0f1216"/><text x="880.0" y="266.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#ece3cf" text-anchor="middle">Soul and spirit</text><circle cx="880.0" cy="380.0" r="70.0" stroke="#c9a96e" stroke-width="1.3" fill="#0b0d10"/><text x="880.0" y="386.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#ece3cf" text-anchor="middle">Mind</text><line x1="530.0" y1="380.0" x2="670.0" y2="380.0" stroke="#c9a96e" stroke-width="1" stroke-dasharray="4 5"/><line x1="530.0" y1="260.0" x2="670.0" y2="260.0" stroke="#c9a96e" stroke-width="1" stroke-dasharray="4 5"/><line x1="530.0" y1="190.0" x2="670.0" y2="190.0" stroke="#c9a96e" stroke-width="1" stroke-dasharray="4 5"/><text x="600.0" y="640.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#b9ad95" text-anchor="middle" font-style="italic">As above, so below: the same order appears in the universe and in the person.</text><text x="1184.0" y="708.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>