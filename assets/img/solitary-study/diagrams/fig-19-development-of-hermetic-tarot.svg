n</text><text x="330.0" y="294.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12" fill="#b9ad95" text-anchor="middle" font-style="italic"><tspan x="330.0" dy="0.0">claims an Egyptian</tspan><tspan x="330.0" dy="14.2">origin</tspan></text><circle cx="440.0" cy="380.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><line x1="440.0" y1="380.0" x2="440.0" y2="450.0" stroke="#8b7448" stroke-width="0.8"/><text x="440.0" y="460.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.06em">1780s</text><text x="440.0" y="480.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#ece3cf" text-anchor="middle">Etteilla</text><text x="440.0" y="514.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12" fill="#b9ad95" text-anchor="middle" font-style="italic"><tspan x="440.0" dy="0.0">cartomancy and a</tspan><tspan x="440.0" dy="14.2">divinatory Tarot</tspan></text><circle cx="550.0" cy="380.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><line x1="550.0" y1="380.0" x2="550.0" y2="290.0" stroke="#8b7448" stroke-width="0.8"/><text x="550.0" y="240.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.06em">1854–56</text><text x="550.0" y="260.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#ece3cf" text-anchor="middle">Lévi</text><text x="550.0" y="294.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12" fill="#b9ad95" text-anchor="middle" font-style="italic"><tspan x="550.0" dy="0.0">trumps joined to</tspan><tspan x="550.0" dy="14.2">Hebrew letters</tspan></text><circle cx="660.0" cy="380.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><line x1="660.0" y1="380.0" x2="660.0" y2="450.0" stroke="#8b7448" stroke-width="0.8"/><text x="660.0" y="460.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.06em">1888 →</text><text x="660.0" y="480.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#ece3cf" text-anchor="middle">The Golden Dawn</text><text x="660.0" y="514.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12" fill="#b9ad95" text-anchor="middle" font-style="italic"><tspan x="660.0" dy="0.0">Tree, planets and</tspan><tspan x="660.0" dy="14.2">decans</tspan></text><circle cx="770.0" cy="380.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><line x1="770.0" y1="380.0" x2="770.0" y2="290.0" stroke="#8b7448" stroke-width="0.8"/><text x="770.0" y="240.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.06em">1909</text><text x="770.0" y="260.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#ece3cf" text-anchor="middle">Rider–Waite–Smith</text><text x="770.0" y="294.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12" fill="#b9ad95" text-anchor="middle" font-style="italic"><tspan x="770.0" dy="0.0">Waite and Pamela</tspan><tspan x="770.0" dy="14.2">Colman Smith</tspan></text><circle cx="880.0" cy="380.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><line x1="880.0" y1="380.0" x2="880.0" y2="450.0" stroke="#8b7448" stroke-width="0.8"/><text x="880.0" y="460.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.06em">1944</text><text x="880.0" y="480.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#ece3cf" text-anchor="middle">Thoth Tarot</text><text x="880.0" y="514.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12" fill="#b9ad95" text-anchor="midd