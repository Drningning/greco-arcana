<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig19-title fig19-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig19-title">Figure 19. The historical development of Hermetic Tarot</title><desc id="fig19-desc">A timeline. About 1440, Italian trionfi cards, the earliest Tarot decks, made for games. 17th to 18th century, the Tarot de Marseille pattern. 1781, Court de Gébelin claims an Egyptian origin. 1780s, Etteilla publishes on cartomancy and a divinatory Tarot. 1854 to 1856, Lévi joins the trumps to the Hebrew letters. 1888 onward, the Golden Dawn revises the attributions and assigns the cards to the Tree, planets and decans. 1909, the Rider–Waite–Smith deck. 1944, Crowley and Harris, the Thoth Tarot. 1947, Case, The Tarot. 1980 onward, Pollack and Greer develop modern interpretation. A dividing line marks the move from game to occult interpretation in 1781.</desc><defs><marker id="arr19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 19</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">The historical development of Hermetic Tarot</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><line x1="80.0" y1="380.0" x2="1120.0" y2="380.0" stroke="#c9a96e" stroke-width="1.4"/><circle cx="110.0" cy="380.0" r="6.0" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><line x1="110.0" y1="380.0" x2="110.0" y2="290.0" stroke="#8b7448" stroke-width="0.8"/><text x="110.0" y="240