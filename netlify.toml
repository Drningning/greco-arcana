  to = "/services/ceremonial-magic/"
  status = 301

[[redirects]]
  from = "/services/talismans-and-amulets"
  to = "/services/talismans-and-amulets/"
  status = 301

[[redirects]]
  from = "/services/tarot-deck-consecration"
  to = "/services/tarot-deck-consecration/"
  status = 301

[[redirects]]
  from = "/services/shewstone-consecration"
  to = "/services/shewstone-consecration/"
  status = 301

[[redirects]]
  from = "/services"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/new-jersey"
  to = "/new-jersey/"
  status = 301

