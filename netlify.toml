# Netlify configuration for Greco Arcana

[build]
  publish = "."

# Pretty URLs — these are the redirects for the new multi-page structure.
# Netlify by default serves /services/banishing-rituals/index.html at the
# URL /services/banishing-rituals/ — these redirects ensure clean URLs work
# even if someone visits without the trailing slash, or via legacy anchor links.

[[redirects]]
  from = "/services/banishing-rituals"
  to = "/services/banishing-rituals/"
  status = 301

[[redirects]]
  from = "/services/hermetic-tarot-reading"
  to = "/services/hermetic-tarot-reading/"
  status = 301

[[redirects]]
  from = "/services/hermetic-praxis-reading"
  to = "/services/hermetic-praxis-reading/"
  status = 301

[[redirects]]
