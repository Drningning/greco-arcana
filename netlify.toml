# --- Retired Essays: 301 the old /writings/ paths (incl. the stray "files 3" folder) to home ---
[[redirects]]
  from = "/writings/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/writings"
  to = "/"
  status = 301

# Cache static assets aggressively
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
