# Netlify configuration for Greco Arcana

[build]
  publish = "."
  # Regenerates The Occult Archives (index pages, catalogue, related links, sitemap block)
  # from occult-archives/_src/catalogue.json on every deploy. Standard-library Python only.
  # If this ever fails, Netlify keeps the previous version of the site live.
  # Then builds The Solitary Study from solitary-study/_src/study.json (its pages and sitemap block).
  command = "python3 scripts/build_archives.py && python3 scripts/build_study.py"

# Pretty URLs — these are the redirects for the new multi-page structure.
# Netlify by default serves /services/banishing-rituals/index.html at the
# URL /services/banishing-rituals/ — these redirects ensure clean URLs work
# even if someone visits without the trailing slash, or via legacy anchor links.

# Banishing Rituals consolidated into Ceremonial Magic. 301 the old paths so the
# existing "banishing ritual NJ" / "house cleansing" ranking passes to the new page.
# force = true so the redirect wins even if the old file is still present on the host.
[[redirects]]
  from = "/services/banishing-rituals/*"
  to = "/services/ceremonial-magic/"
  status = 301
  force = true

[[redirects]]
  from = "/services/banishing-rituals"
  to = "/services/ceremonial-magic/"
  status = 301
  force = true

