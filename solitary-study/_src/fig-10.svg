<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig10-title fig10-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig10-title">Figure 10. Elemental correspondences</title><desc id="fig10-desc">A square with an element at each corner. Fire, hot and dry: choleric humour, summer, tetrahedron, Wands. Air, hot and wet: sanguine, spring, octahedron, Swords. Water, cold and wet: phlegmatic, winter, icosahedron, Cups. Earth, cold and dry: melancholic, autumn, cube, Pentacles. The sides of the square are labelled with the shared quality: hot, wet, cold, dry.</desc><defs><marker id="arr10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 10</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">Elemental correspondences</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><polygon points="330.0,220.0 870.0,220.0 870.0,560.0 330.0,560.0" stroke="#c9a96e" stroke-width="1.4" fill="none"/><polygon points="600.0,200.0 890.0,390.0 600.0,580.0 310.0,390.0" stroke="#8b7448" stroke-width="0.8" fill="none"/><circle cx="330.0" cy="220.0" r="58.0" stroke="#c9a96e" stroke-width="1.5" fill="#12151a"/><text x="330.0" y="227.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">FIRE</text><text x="330.0" y="110.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15.5" fill="#ece3cf" text-anchor="middle" font-style="italic">Hot and dry</text><text x="330.0" y="130.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#b9ad95" text-anchor="middle">Choleric · Summer</text><text x="330.0" y="150.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#b9ad95" text-anchor="middle">Tetrahedron · Wands</text><circle cx="870.0" cy="220.0" r="58.0" stroke="#c9a96e" stroke-width="1.5" fill="#12151a"/><text x="870.0" y="227.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">AIR</text><text x="870.0" y="110.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15.5" fill="#ece3cf" text-anchor="middle" font-style="italic">Hot and wet</text><text x="870.0" y="130.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#b9ad95" text-anchor="middle">Sanguine · Spring</text><text x="870.0" y="150.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#b9ad95" text-anchor="middle">Octahedron · Swords</text><circle cx="870.0" cy="560.0" r="58.0" stroke="#c9a96e" stroke-width="1.5" fill="#12151a"/><text x="870.0" y="567.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">WATER</text><text x="870.0" y="652.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15.5" fill="#ece3cf" text-anchor="middle" font-style="italic">Cold and wet</text><text x="870.0" y="672.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#b9ad95" text-anchor="middle">Phlegmatic · Winter</text><text x="870.0" y="692.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#b9ad95" text-anchor="middle">Icosahedron · Cups</text><circle cx="330.0" cy="560.0" r="58.0" stroke="#c9a96e" stroke-width="1.5" fill="#12151a"/><text x="330.0" y="567.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">EARTH</text><text x="330.0" y="652.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15.5" fill="#ece3cf" text-anchor="middle" font-style="italic">Cold and dry</text><text x="330.0" y="672.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#b9ad95" text-anchor="middle">Melancholic · Autumn</text><text x="330.0" y="692.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#b9ad95" text-anchor="middle">Cube · Pentacles</text><text x="600.0" y="212.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#8b7448" text-anchor="middle" letter-spacing="0.3em">HOT</text><text x="890.0" y="395.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#8b7448" text-anchor="middle" letter-spacing="0.3em">WET</text><text x="600.0" y="590.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#8b7448" text-anchor="middle" letter-spacing="0.3em">COLD</text><text x="305.0" y="395.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#8b7448" text-anchor="middle" letter-spacing="0.3em">DRY</text><text x="1184.0" y="708.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>