<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig4-title fig4-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig4-title">Figure 4. Masonic initiation and symbolic interpretation</title><desc id="fig4-desc">Four concentric rings around a drawing of a rough stone. From the outer ring inward: Literal, a stone as it comes from the quarry; Moral, the imperfect nature of the candidate to be improved by education and discipline; Philosophical, matter not yet shaped by form, in Platonic terms; Esoteric, the soul&#x27;s rectification, compared with the alchemist&#x27;s prima materia. Labels on the right repeat the four readings.</desc><defs><marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 4</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">Masonic initiation and symbolic interpretation</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><circle cx="330.0" cy="400.0" r="240.0" stroke="#c9a96e" stroke-width="1.4" fill="#0b0d10"/><text x="330.0" y="180.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.2em">LITERAL</text><circle cx="330.0" cy="400.0" r="180.0" stroke="#c9a96e" stroke-width="1.2" fill="#0f1216"/><text x="330.0" y="240.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.2em">MORAL</text><circle cx="330.0" cy="400.0" r="120.0" stroke="#c9a96e" stroke-width="1.2" fill="#0b0d10"/><text x="330.0" y="300.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.2em">PHILOSOPHICAL</text><circle cx="330.0" cy="400.0" r="62.0" stroke="#c9a96e" stroke-width="1.2" fill="#0f1216"/><text x="330.0" y="358.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.2em">ESOTERIC</text><polygon points="302.0,390.0 322.0,370.0 356.0,378.0 362.0,408.0 342.0,430.0 306.0,424.0" stroke="#c9a96e" stroke-width="1.3" fill="#2a2620"/><text x="640.0" y="190.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#c9a96e" text-anchor="start" letter-spacing="0.15em">LITERAL</text><text x="640.0" y="214.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#ece3cf" text-anchor="start"><tspan x="640.0" dy="0.0">A stone as it comes from the quarry, unshaped by the</tspan><tspan x="640.0" dy="17.7">builder.</tspan></text><line x1="502.8" y1="264.4" x2="630.0" y2="186.0" stroke="#8b7448" stroke-width="0.8" stroke-dasharray="2 3"/><text x="640.0" y="300.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#c9a96e" text-anchor="start" letter-spacing="0.15em">MORAL</text><text x="640.0" y="324.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#ece3cf" text-anchor="start"><tspan x="640.0" dy="0.0">The imperfect nature of the candidate, to be</tspan><tspan x="640.0" dy="17.7">improved by education and self-discipline.</tspan></text><line x1="459.6" y1="305.8" x2="630.0" y2="296.0" stroke="#8b7448" stroke-width="0.8" stroke-dasharray="2 3"/><text x="640.0" y="410.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#c9a96e" text-anchor="start" letter-spacing="0.15em">PHILOSOPHICAL</text><text x="640.0" y="434.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#ece3cf" text-anchor="start"><tspan x="640.0" dy="0.0">Matter not yet informed by form: the Platonic</tspan><tspan x="640.0" dy="17.7">contrast between the material and the intelligible.</tspan></text><line x1="416.4" y1="347.2" x2="630.0" y2="406.0" stroke="#8b7448" stroke-width="0.8" stroke-dasharray="2 3"/><text x="640.0" y="520.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#c9a96e" text-anchor="start" letter-spacing="0.15em">ESOTERIC</text><text x="640.0" y="544.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#ece3cf" text-anchor="start"><tspan x="640.0" dy="0.0">The soul to be rectified, compared by many writers</tspan><tspan x="640.0" dy="17.7">with the alchemist&#x27;s prima materia. A comparative</tspan><tspan x="640.0" dy="17.7">reading.</tspan></text><line x1="374.6" y1="387.2" x2="630.0" y2="516.0" stroke="#8b7448" stroke-width="0.8" stroke-dasharray="2 3"/><text x="330.0" y="690.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle" font-style="italic">The emblem: the rough ashlar</text><text x="1184.0" y="708.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>