="370.0" y1="515.0" x2="520.0" y2="470.0" stroke="#8b7448" stroke-width="0.9" stroke-dasharray="3 4"/><line x1="830.0" y1="515.0" x2="680.0" y2="470.0" stroke="#8b7448" stroke-width="0.9" stroke-dasharray="3 4"/><line x1="600.0" y1="540.0" x2="600.0" y2="600.0" stroke="#8b7448" stroke-width="0.9" stroke-dasharray="3 4"/><text x="600.0" y="740.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14.5" fill="#ece3cf" text-anchor="middle" font-style="italic">Synthesis: understanding that comes through sorrow; the clarity of the mind tested by grief and separation.</text><text x="1184.0" y="768.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>