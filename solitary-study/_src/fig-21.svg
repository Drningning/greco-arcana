<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="fig21-title fig21-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig21-title">Figure 21. The Three of Swords: a correspondence analysis</title><desc id="fig21-desc">A central card outline labelled Three of Swords with five surrounding boxes. Number three: Binah, Understanding, the sphere of Saturn on the Tree of Life, Stage V. Suit: Swords, the element Air, the world of Yetzirah, Stage IV. Decan: Saturn in Libra, the second decan of Libra in the Golden Dawn system, Stage IV. Title: Lord of Sorrow, the Golden Dawn title of the card, Stage VII. Image: a heart pierced by three swords under storm clouds and rain, Rider–Waite–Smith 1909, Stage VIII. A line beneath summarizes: understanding that comes through sorrow; the mind&#x27;s clarity tested by grief.</desc><defs><marker id="arr21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="780" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="764" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 21</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">The Three of Swords: a correspondence analysis</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><rect x="520.0" y="280.0" width="160.0" height="260.0" rx="6" stroke="#c9a96e" stroke-width="1.5" fill="#14110b"/><text x="600.0" y="318.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="22" fill="#c9a96e" text-anchor="middle">III</text><path d="M600,450 C530,400 560,340 600,380 C640,340 670,400 600,450 Z" stroke="#a04a3a" stroke-