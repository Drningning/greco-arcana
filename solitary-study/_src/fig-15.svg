<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig15-title fig15-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig15-title">Figure 15. The four Qabalistic worlds</title><desc id="fig15-desc">Four horizontal tiers. Atziluth, the world of emanation: Yod, Fire, Wands, the divine names. Briah, the world of creation: Heh, Water, Cups, the archangels. Yetzirah, the world of formation: Vav, Air, Swords, the angelic choirs. Assiah, the world of action: final Heh, Earth, Pentacles, the planets and the material world.</desc><defs><marker id="arr15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 15</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">The four Qabalistic worlds</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><text x="140.0" y="140.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.18em">WORLD</text><text x="330.0" y="140.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.18em"></text><text x="520.0" y="140.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.18em">LETTER</text><text x="700.0" y="140.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.18em">ELEMENT · SUIT</text><text x="930.0" y="140.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.18em">ASSOCIATED BEINGS</text><rect x="60.0" y="170.0" width="1080.0" height="100.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#14110b"/><text x="140.0" y="228.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="19" fill="#c9a96e" text-anchor="middle">ATZILUTH</text><text x="330.0" y="228.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#b9ad95" text-anchor="middle" font-style="italic">Emanation</text><text x="520.0" y="228.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#ece3cf" text-anchor="middle">י Yod</text><text x="700.0" y="228.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#ece3cf" text-anchor="middle">Fire · Wands</text><text x="930.0" y="228.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#b9ad95" text-anchor="middle">Divine names</text><rect x="60.0" y="288.0" width="1080.0" height="100.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="140.0" y="346.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="19" fill="#c9a96e" text-anchor="middle">BRIAH</text><text x="330.0" y="346.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#b9ad95" text-anchor="middle" font-style="italic">Creation</text><text x="520.0" y="346.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#ece3cf" text-anchor="middle">ה Heh</text><text x="700.0" y="346.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#ece3cf" text-anchor="middle">Water · Cups</text><text x="930.0" y="346.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#b9ad95" text-anchor="middle">Archangels</text><rect x="60.0" y="406.0" width="1080.0" height="100.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="140.0" y="464.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="19" fill="#c9a96e" text-anchor="middle">YETZIRAH</text><text x="330.0" y="464.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#b9ad95" text-anchor="middle" font-style="italic">Formation</text><text x="520.0" y="464.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#ece3cf" text-anchor="middle">ו Vav</text><text x="700.0" y="464.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#ece3cf" text-anchor="middle">Air · Swords</text><text x="930.0" y="464.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#b9ad95" text-anchor="middle">Angelic choirs</text><rect x="60.0" y="524.0" width="1080.0" height="100.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="140.0" y="582.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="19" fill="#c9a96e" text-anchor="middle">ASSIAH</text><text x="330.0" y="582.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#b9ad95" text-anchor="middle" font-style="italic">Action</text><text x="520.0" y="582.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#ece3cf" text-anchor="middle">ה Heh (final)</text><text x="700.0" y="582.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#ece3cf" text-anchor="middle">Earth · Pentacles</text><text x="930.0" y="582.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#b9ad95" text-anchor="middle">Planets and the material world</text><text x="600.0" y="670.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle" font-style="italic">Read downward: the divine name YHVH unfolds through four worlds from emanation to action.</text><text x="1184.0" y="708.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>