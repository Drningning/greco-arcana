<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig7-title fig7-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig7-title">Figure 7. The five Platonic solids</title><desc id="fig7-desc">Five geometric solids drawn in line. Tetrahedron: 4 triangular faces, Fire. Octahedron: 8 triangular faces, Air. Icosahedron: 20 triangular faces, Water. Cube: 6 square faces, Earth. Dodecahedron: 12 pentagonal faces, used by the god for the whole cosmos.</desc><defs><marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 7</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">The five Platonic solids</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><polygon points="140.0,238.0 193.7,331.0 86.3,331.0" stroke="#c9a96e" stroke-width="1.3" fill="none"/><line x1="140.0" y1="304.0" x2="140.0" y2="238.0" stroke="#c9a96e" stroke-width="1"/><line x1="140.0" y1="304.0" x2="193.7" y2="331.0" stroke="#c9a96e" stroke-width="1"/><line x1="140.0" y1="304.0" x2="86.3" y2="331.0" stroke="#c9a96e" stroke-width="1"/><text x="140.0" y="410.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">TETRAHEDRON</text><text x="140.0" y="432.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle" font-style="italic">4 triangles</text><text x="140.0" y="460.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="18" fill="#ece3cf" text-anchor="middle">Fire</text><polygon points="320.4,300.0 357.6,315.5 419.6,300.0 382.4,284.5" stroke="#c9a96e" stroke-width="1" fill="none"/><line x1="370.0" y1="238.0" x2="320.4" y2="300.0" stroke="#c9a96e" stroke-width="1.1"/><line x1="370.0" y1="362.0" x2="320.4" y2="300.0" stroke="#c9a96e" stroke-width="1.1"/><line x1="370.0" y1="238.0" x2="357.6" y2="315.5" stroke="#c9a96e" stroke-width="1.1"/><line x1="370.0" y1="362.0" x2="357.6" y2="315.5" stroke="#c9a96e" stroke-width="1.1"/><line x1="370.0" y1="238.0" x2="419.6" y2="300.0" stroke="#c9a96e" stroke-width="1.1"/><line x1="370.0" y1="362.0" x2="419.6" y2="300.0" stroke="#c9a96e" stroke-width="1.1"/><line x1="370.0" y1="238.0" x2="382.4" y2="284.5" stroke="#c9a96e" stroke-width="1.1"/><line x1="370.0" y1="362.0" x2="382.4" y2="284.5" stroke="#c9a96e" stroke-width="1.1"/><text x="370.0" y="410.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">OCTAHEDRON</text><text x="370.0" y="432.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle" font-style="italic">8 triangles</text><text x="370.0" y="460.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="18" fill="#ece3cf" text-anchor="middle">Air</text><polygon points="600.0,238.0 653.7,269.0 653.7,331.0 600.0,362.0 546.3,331.0 546.3,269.0" stroke="#c9a96e" stroke-width="1.3" fill="none"/><polygon points="615.5,273.2 615.5,326.8 569.0,300.0" stroke="#c9a96e" stroke-width="1" fill="none"/><line x1="600.0" y1="238.0" x2="615.5" y2="273.2" stroke="#c9a96e" stroke-width="0.9"/><line x1="653.7" y1="269.0" x2="615.5" y2="273.2" stroke="#c9a96e" stroke-width="0.9"/><line x1="653.7" y1="331.0" x2="615.5" y2="326.8" stroke="#c9a96e" stroke-width="0.9"/><line x1="600.0" y1="362.0" x2="615.5" y2="326.8" stroke="#c9a96e" stroke-width="0.9"/><line x1="546.3" y1="331.0" x2="569.0" y2="300.0" stroke="#c9a96e" stroke-width="0.9"/><line x1="546.3" y1="269.0" x2="569.0" y2="300.0" stroke="#c9a96e" stroke-width="0.9"/><text x="600.0" y="410.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">ICOSAHEDRON</text><text x="600.0" y="432.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle" font-style="italic">20 triangles</text><text x="600.0" y="460.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="18" fill="#ece3cf" text-anchor="middle">Water</text><polygon points="791.6,285.1 844.9,285.1 844.9,338.4 791.6,338.4" stroke="#c9a96e" stroke-width="1.3" fill="none"/><polygon points="815.1,261.6 868.4,261.6 868.4,314.9 815.1,314.9" stroke="#c9a96e" stroke-width="0.9" fill="none" opacity="0.7"/><line x1="791.6" y1="285.1" x2="815.1" y2="261.6" stroke="#c9a96e" stroke-width="1"/><line x1="844.9" y1="285.1" x2="868.4" y2="261.6" stroke="#c9a96e" stroke-width="1"/><line x1="844.9" y1="338.4" x2="868.4" y2="314.9" stroke="#c9a96e" stroke-width="1"/><line x1="791.6" y1="338.4" x2="815.1" y2="314.9" stroke="#c9a96e" stroke-width="1"/><text x="830.0" y="410.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">CUBE</text><text x="830.0" y="432.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle" font-style="italic">6 squares</text><text x="830.0" y="460.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="18" fill="#ece3cf" text-anchor="middle">Earth</text><polygon points="1060.0,238.0 1096.4,249.8 1119.0,280.8 1119.0,319.2 1096.4,350.2 1060.0,362.0 1023.6,350.2 1001.0,319.2 1001.0,280.8 1023.6,249.8" stroke="#c9a96e" stroke-width="1.3" fill="none"/><polygon points="1060.0,265.9 1092.4,289.5 1080.0,327.6 1040.0,327.6 1027.6,289.5" stroke="#c9a96e" stroke-width="1" fill="none"/><line x1="1060.0" y1="238.0" x2="1060.0" y2="265.9" stroke="#c9a96e" stroke-width="0.9"/><line x1="1119.0" y1="280.8" x2="1092.4" y2="289.5" stroke="#c9a96e" stroke-width="0.9"/><line x1="1096.4" y1="350.2" x2="1080.0" y2="327.6" stroke="#c9a96e" stroke-width="0.9"/><line x1="1023.6" y1="350.2" x2="1040.0" y2="327.6" stroke="#c9a96e" stroke-width="0.9"/><line x1="1001.0" y1="280.8" x2="1027.6" y2="289.5" stroke="#c9a96e" stroke-width="0.9"/><text x="1060.0" y="410.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">DODECAHEDRON</text><text x="1060.0" y="432.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle" font-style="italic">12 pentagons</text><text x="1060.0" y="460.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="18" fill="#ece3cf" text-anchor="middle">The whole cosmos</text><text x="600.0" y="560.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle" font-style="italic">The first four are built from two right triangles; the elements can pass into one another by recombining them.</text><text x="600.0" y="582.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="14" fill="#b9ad95" text-anchor="middle" font-style="italic">Earth, made of squares, does not transform into the others (Timaeus 56d).</text><text x="1184.0" y="708.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>