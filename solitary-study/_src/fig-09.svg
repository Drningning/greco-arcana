<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig9-title fig9-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig9-title">Figure 9. Agrippa&#x27;s three worlds</title><desc id="fig9-desc">Three stacked bands. Top: the intellectual world, Book III, ceremonial magic: angels and intelligences, divine names, religion. Middle: the celestial world, Book II, celestial and mathematical magic: stars and planets, number, harmony and proportion. Bottom: the elemental world, Book I, natural magic: elements, stones, metals, plants and animals. A downward arrow on the right reads virtues descend; an upward arrow on the left reads the magician ascends.</desc><defs><marker id="arr9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 9</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">Agrippa&#x27;s three worlds</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><rect x="220.0" y="130.0" width="760.0" height="130.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#14110b"/><text x="600.0" y="170.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="18" fill="#c9a96e" text-anchor="middle" letter-spacing="0.12em">THE INTELLECTUAL WORLD</text><text x="600.0" y="200.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="16" fill="#ece3cf" text-anchor="middle" font-style="italic">Book III · Ceremonial magic</text><text x="600.0" y="230.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#b9ad95" text-anchor="middle">Angels and intelligences · divine names · religion and ceremony</text><rect x="220.0" y="290.0" width="760.0" height="130.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="600.0" y="330.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="18" fill="#c9a96e" text-anchor="middle" letter-spacing="0.12em">THE CELESTIAL WORLD</text><text x="600.0" y="360.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="16" fill="#ece3cf" text-anchor="middle" font-style="italic">Book II · Celestial and mathematical magic</text><text x="600.0" y="390.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#b9ad95" text-anchor="middle">Stars and planets · number · harmony and proportion · images</text><rect x="220.0" y="450.0" width="760.0" height="130.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="600.0" y="490.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="18" fill="#c9a96e" text-anchor="middle" letter-spacing="0.12em">THE ELEMENTAL WORLD</text><text x="600.0" y="520.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="16" fill="#ece3cf" text-anchor="middle" font-style="italic">Book I · Natural magic</text><text x="600.0" y="550.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#b9ad95" text-anchor="middle">The four elements · stones and metals · plants and animals</text><line x1="1040.0" y1="140.0" x2="1040.0" y2="600.0" stroke="#c9a96e" stroke-width="1.6" marker-end="url(#arr9)"/><text x="1040.0" y="625.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">Virtues descend</text><line x1="160.0" y1="600.0" x2="160.0" y2="140.0" stroke="#c9a96e" stroke-width="1.6" marker-end="url(#arr9)"/><text x="160.0" y="625.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">The magician ascends</text><text x="1184.0" y="708.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>