<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="fig17-title fig17-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig17-title">Figure 17. Origins and convergence of Golden Dawn ceremonial magic</title><desc id="fig17-desc">Eight source boxes on the left: Neoplatonic theurgy; Hermeticism; Renaissance occult philosophy (Ficino, Agrippa); Christian Cabala and Hermetic Qabalah (Lévi); Enochian magic (Dee); astrology and natural magic; Rosicrucianism; Freemasonry and the Societas Rosicruciana in Anglia. Arrows converge on a central box: the Golden Dawn, 1888, Westcott, Mathers, Woodman. From it arrows lead to Crowley and Thelema; Waite; Fortune and the Inner Light; Case and the Builders of the Adytum; Regardie&#x27;s publication 1937 to 1940, which leads to the Ciceros and other modern practitioners including Greer. Separate dashed boxes: Bardon, independent Hermetic training; Miller, contemporary practical magic.</desc><defs><marker id="arr17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="800" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="784" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 17</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">Origins and convergence of Golden Dawn ceremonial magic</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><rect x="40.0" y="110.0" width="360.0" height="52.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="220.0" y="140.6" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#ece3cf" text-an