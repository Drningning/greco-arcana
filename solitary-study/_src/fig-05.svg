<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig5-title fig5-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig5-title">Figure 5. Plato, Plotinus and Neoplatonic metaphysics</title><desc id="fig5-desc">Two vertical columns. Left, Plato: the Good; the Forms; the World Soul; the visible cosmos. Right, Plotinus: the One; Intellect (Nous), containing the Forms; Soul, including the World Soul and individual souls; Nature and the material world; Matter. A downward arrow on the far right is labelled procession; an upward arrow on the far left is labelled return.</desc><defs><marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="720" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="704" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 5</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">Plato, Plotinus and Neoplatonic metaphysics</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><text x="330.0" y="120.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#c9a96e" text-anchor="middle" letter-spacing="0.25em">PLATO</text><text x="830.0" y="120.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#c9a96e" text-anchor="middle" letter-spacing="0.25em">PLOTINUS</text><rect x="200.0" y="145.0" width="260.0" height="74.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="330.0" y="179.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="16" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">The Good</text><text x="330.0" y="197.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">the source of being and knowing</text><line x1="330.0" y1="219.0" x2="330.0" y2="265.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr5)"/><rect x="200.0" y="265.0" width="260.0" height="74.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="330.0" y="299.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="16" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">The Forms</text><text x="330.0" y="317.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">eternal intelligible models</text><line x1="330.0" y1="339.0" x2="330.0" y2="385.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr5)"/><rect x="200.0" y="385.0" width="260.0" height="74.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="330.0" y="419.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="16" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">The World Soul</text><text x="330.0" y="437.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">the soul of the cosmos (Timaeus)</text><line x1="330.0" y1="459.0" x2="330.0" y2="505.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr5)"/><rect x="200.0" y="505.0" width="260.0" height="74.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="330.0" y="539.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="16" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">The visible cosmos</text><text x="330.0" y="557.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">image of the eternal model</text><rect x="700.0" y="145.0" width="260.0" height="66.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#15120c"/><text x="830.0" y="175.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="16" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">The One</text><text x="830.0" y="193.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">beyond being; the source</text><line x1="830.0" y1="211.0" x2="830.0" y2="241.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr5)"/><rect x="700.0" y="241.0" width="260.0" height="66.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="830.0" y="271.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="16" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Intellect · Nous</text><text x="830.0" y="289.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">contains the Forms</text><line x1="830.0" y1="307.0" x2="830.0" y2="337.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr5)"/><rect x="700.0" y="337.0" width="260.0" height="66.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="830.0" y="367.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="16" fill="#ece3cf" text-anchor="middle" letter-spacing="0.06em">Soul</text><text x="830.0" y="385.5" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">World Soul and individual souls</text><line x1="830.0" y1="403.0" x2="830.0" y2="433.0" stroke="#c9a96e" stroke-width="1.2" marker-end="url(#arr5)"/><rect x="700.0" y="433.0" width="260.0" height="66.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="830.0" y="463.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="16" fill="#ece3cf" text-an