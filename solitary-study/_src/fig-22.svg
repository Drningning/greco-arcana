<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="fig22-title fig22-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig22-title">Figure 22. The Great Work and the Masonic temple</title><desc id="fig22-desc">A temple plan seen from above, entered from the east-facing porch at the bottom. The porch with two pillars, Jachin and Boaz; the holy place; the holy of holies. Beside each, three columns: the alchemical stage, the condition of the soul and the curriculum stages. Porch: nigredo, preparation, Stages I and II. Holy place: albedo and citrinitas, purification and illumination, Stages III to VI. Holy of holies: rubedo, union and regeneration, Stages VII to IX. Marked as a comparative interpretation.</desc><defs><marker id="arr22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="780" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="764" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 22</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">The Great Work and the Masonic temple</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><rect x="160.0" y="130.0" width="300.0" height="170.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#14110b"/><text x="310.0" y="220.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">HOLY OF HOLIES</text><rect x="160.0" y="300.0" width="300.0" height="230.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="310.0" y="420.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">HOLY PLACE</text><rect x="160.0" y="530.0" width="300.0" height="110.0" rx="2" stroke="#c9a96e" stroke-width="1.1" fill="#12151a"/><text x="310.0" y="590.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="13" fill="#c9a96e" text-anchor="middle" letter-spacing="0.15em">PORCH</text><circle cx="230.0" cy="655.0" r="14.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><circle cx="390.0" cy="655.0" r="14.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="230.0" y="690.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12" fill="#b9ad95" text-anchor="middle" font-style="italic">Jachin</text><text x="390.0" y="690.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12" fill="#b9ad95" text-anchor="middle" font-style="italic">Boaz</text><text x="600.0" y="115.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.16em">ALCHEMICAL STAGE</text><text x="820.0" y="115.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.16em">CONDITION OF THE SOUL</text><text x="1030.0" y="115.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="0.16em">STAGES</text><line x1="460.0" y1="215.0" x2="500.0" y2="215.0" stroke="#8b7448" stroke-width="1.2" stroke-dasharray="3 4"/><text x="600.0" y="220.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#ece3cf" text-anchor="middle">Rubedo</text><text x="820.0" y="220.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#b9ad95" text-anchor="middle" font-style="italic">Union · regeneration</text><text x="1030.0" y="220.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">VII–IX</text><line x1="460.0" y1="415.0" x2="500.0" y2="415.0" stroke="#8b7448" stroke-width="1.2" stroke-dasharray="3 4"/><text x="600.0" y="420.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#ece3cf" text-anchor="middle">Albedo · Citrinitas</text><text x="820.0" y="420.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#b9ad95" text-anchor="middle" font-style="italic">Purification · illumination</text><text x="1030.0" y="420.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">III–VI</text><line x1="460.0" y1="585.0" x2="500.0" y2="585.0" stroke="#8b7448" stroke-width="1.2" stroke-dasharray="3 4"/><text x="600.0" y="590.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="17" fill="#ece3cf" text-anchor="middle">Nigredo</text><text x="820.0" y="590.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="15" fill="#b9ad95" text-anchor="middle" font-style="italic">Preparation · humility</text><text x="1030.0" y="590.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="17" fill="#c9a96e" text-anchor="middle">I–II</text><text x="600.0" y="740.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">Comparative interpretation (Greco Arcana) · plan simplified from 1 Kings 6–7</text><text x="1184.0" y="768.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>