<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="fig16-title fig16-desc" class="ss-svg" xmlns:c2pa="http://c2pa.org/manifest"><title id="fig16-title">Figure 16. Alchemy and Rosicrucian regeneration</title><desc id="fig16-desc">A circle of four stations around a rose cross drawn as an original emblem. Nigredo, the blackening: in the laboratory, decomposition; spiritually, mortification; in psychological reading, confronting the shadow. Albedo, the whitening: purification; washing of the soul; reflection and clarity. Citrinitas, the yellowing: maturation; illumination; dawning insight. Rubedo, the reddening: completion of the Stone; regeneration; integration. A note says the rough ashlar becoming the perfect ashlar is a comparative parallel.</desc><defs><marker id="arr16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a96e"/></marker></defs><rect width="1200" height="780" fill="#0b0d10"/><rect x="8" y="8" width="1184" height="764" fill="none" stroke="#8b7448" stroke-width="0.8"/><text x="600.0" y="34" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" letter-spacing="0.3em" fill="#c9a96e" text-anchor="middle">FIGURE 16</text><text x="600.0" y="62" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="21" fill="#ece3cf" text-anchor="middle" letter-spacing="0.04em">Alchemy and Rosicrucian regeneration</text><line x1="540.0" y1="78" x2="660.0" y2="78" stroke="#8b7448" stroke-width="1"/><polygon points="585.4,352.4 614.6,352.4 614.6,405.4 657.2,405.4 657.2,434.6 614.6,434.6 614.6,503.2 585.4,503.2 585.4,434.6 542.8,434.6 542.8,405.4 585.4,405.4" stroke="#c9a96e" stroke-width="1.3" fill="#14110b"/><circle cx="600.0" cy="402.8" r="15.7" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="616.3" cy="414.7" r="15.7" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="610.1" cy="433.9" r="15.7" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="589.9" cy="433.9" r="15.7" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="583.7" cy="414.7" r="15.7" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="605.1" cy="408.6" r="11.4" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="612.4" cy="421.3" r="11.4" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="602.6" cy="432.2" r="11.4" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="589.2" cy="426.2" r="11.4" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="590.7" cy="411.6" r="11.4" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="605.8" cy="414.8" r="7.2" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="606.8" cy="423.9" r="7.2" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="598.4" cy="427.6" r="7.2" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="592.2" cy="420.8" r="7.2" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="596.8" cy="412.9" r="7.2" stroke="#a04a3a" stroke-width="1" fill="none"/><circle cx="600.0" cy="420.0" r="6.2" stroke="#c9a96e" stroke-width="1.2" fill="#c9a96e"/><circle cx="600.0" cy="420.0" r="200.0" stroke="#8b7448" stroke-width="0.9" fill="none" stroke-dasharray="3 5"/><circle cx="458.6" cy="278.6" r="46.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="458.6" y="276.6" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.12em">NIGREDO</text><text x="458.6" y="294.6" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">the blackening</text><text x="393.2" y="223.2" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#ece3cf" text-anchor="end">Laboratory: Decomposition</text><text x="393.2" y="245.2" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#b9ad95" text-anchor="end">Spiritual: Mortification</text><text x="393.2" y="267.2" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#b9ad95" text-anchor="end">Psychological: Facing the shadow</text><circle cx="741.4" cy="278.6" r="46.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="741.4" y="276.6" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.12em">ALBEDO</text><text x="741.4" y="294.6" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">the whitening</text><text x="806.8" y="223.2" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#ece3cf" text-anchor="start">Laboratory: Purification</text><text x="806.8" y="245.2" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#b9ad95" text-anchor="start">Spiritual: Washing of the soul</text><text x="806.8" y="267.2" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#b9ad95" text-anchor="start">Psychological: Reflection, clarity</text><circle cx="741.4" cy="561.4" r="46.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="741.4" y="559.4" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.12em">CITRINITAS</text><text x="741.4" y="577.4" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">the yellowing</text><text x="806.8" y="576.8" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#ece3cf" text-anchor="start">Laboratory: Maturation</text><text x="806.8" y="598.8" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#b9ad95" text-anchor="start">Spiritual: Illumination</text><text x="806.8" y="620.8" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#b9ad95" text-anchor="start">Psychological: Dawning insight</text><circle cx="458.6" cy="561.4" r="46.0" stroke="#c9a96e" stroke-width="1.4" fill="#12151a"/><text x="458.6" y="559.4" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12" fill="#c9a96e" text-anchor="middle" letter-spacing="0.12em">RUBEDO</text><text x="458.6" y="577.4" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="12.5" fill="#b9ad95" text-anchor="middle" font-style="italic">the reddening</text><text x="393.2" y="576.8" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#ece3cf" text-anchor="end">Laboratory: The Stone completed</text><text x="393.2" y="598.8" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#b9ad95" text-anchor="end">Spiritual: Regeneration</text><text x="393.2" y="620.8" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13.5" fill="#b9ad95" text-anchor="end">Psychological: Integration</text><path d="M509.2,241.8 A200,200 0 0 1 690.8,241.8" stroke="#c9a96e" stroke-width="1.4" fill="none" marker-end="url(#arr16)"/><path d="M778.2,329.2 A200,200 0 0 1 778.2,510.8" stroke="#c9a96e" stroke-width="1.4" fill="none" marker-end="url(#arr16)"/><path d="M690.8,598.2 A200,200 0 0 1 509.2,598.2" stroke="#c9a96e" stroke-width="1.4" fill="none" marker-end="url(#arr16)"/><path d="M421.8,510.8 A200,200 0 0 1 421.8,329.2" stroke="#c9a96e" stroke-width="1.4" fill="none" marker-end="url(#arr16)"/><text x="600.0" y="735.0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="13" fill="#b9ad95" text-anchor="middle" font-style="italic">Comparative (Greco Arcana): the rough ashlar shaped into the perfect ashlar parallels the prima materia perfected as the Stone.</text><text x="1184.0" y="768.0" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="9.5" letter-spacing="0.2em" fill="#8b7448" text-anchor="end">GRECO ARCANA · THE SOLITARY STUDY · ORIGINAL EDUCATIONAL DIAGRAM</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>